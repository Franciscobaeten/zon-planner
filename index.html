<!DOCTYPE html>
<html lang="nl">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Zonne-planner voor je toestellen</title>
<script src="https://cdnjs.cloudflare.com/ajax/libs/Chart.js/4.4.0/chart.umd.min.js"></script>
<script src="forecast_data.js"></script>
<style>
* { box-sizing: border-box; }
body { margin:0; padding:20px; font-family:-apple-system,BlinkMacSystemFont,"Segoe UI",Roboto,Helvetica,Arial,sans-serif; background:#f7f8fa; color:#1f2933; line-height:1.5; }
h1 { font-size:20px; margin:0 0 2px; }
.sub { color:#6b7280; font-size:13px; margin-bottom:16px; }
.warn { background:#fee2e2; border:1px solid #fca5a5; color:#991b1b; font-size:13px; padding:10px 12px; border-radius:8px; margin-bottom:16px; }
.card { background:#fff; border:1px solid #e5e7eb; border-radius:10px; padding:16px; margin-bottom:18px; }
.card h2 { font-size:15px; margin:0 0 10px; }
.row { display:flex; flex-wrap:wrap; gap:8px; align-items:center; margin-bottom:6px; }
.row .lbl { font-size:12px; color:#6b7280; width:100%; margin-bottom:2px; }
button.opt { border:1px solid #d1d5db; background:#fff; color:#1f2933; border-radius:20px; padding:6px 13px; font-size:13px; cursor:pointer; }
button.opt.active { background:#1d4ed8; color:#fff; border-color:#1d4ed8; }
button.day { border:1px solid #d1d5db; background:#fff; border-radius:8px; padding:6px 12px; font-size:13px; cursor:pointer; }
button.day.active { background:#111827; color:#fff; border-color:#111827; }
.custom { display:flex; align-items:center; gap:6px; font-size:13px; }
.custom input { width:64px; padding:5px 7px; border:1px solid #d1d5db; border-radius:6px; font-size:13px; }
.result { background:#ecfdf5; border:1px solid #a7f3d0; border-radius:8px; padding:12px 14px; margin-top:12px; font-size:14px; }
.result .big { font-size:19px; font-weight:700; color:#047857; }
.chartbox { position:relative; height:300px; margin-top:14px; }
table { width:100%; border-collapse:collapse; font-size:13px; }
th,td { text-align:left; padding:7px 8px; border-bottom:1px solid #eef0f2; }
th { color:#6b7280; font-weight:600; font-size:11.5px; text-transform:uppercase; letter-spacing:.03em; }
td.win { font-variant-numeric:tabular-nums; font-weight:600; }
.hint { font-size:12px; color:#6b7280; margin-top:8px; }
</style>
</head>
<body>
<h1>Zonne-planner voor je toestellen</h1>
<div class="sub" id="sub">Wanneer draaien vaatwas, wasmachine en droogkast het best op je eigen zonnestroom?</div>
<div id="app"></div>

<script>
function toMin(hhmm){ const p=hhmm.split(":"); return (+p[0])*60+(+p[1]); }
function fmt(min){ return String(Math.floor(min/60)).padStart(2,"0")+":"+String(min%60).padStart(2,"0"); }

const app = document.getElementById("app");
if (typeof FORECAST === "undefined" || !FORECAST.days || !FORECAST.days.length){
  app.innerHTML = '<div class="warn">Nog geen voorspelling gevonden. Voer eerst <b>forecast_ophalen.py</b> uit (dat maakt <code>forecast_data.js</code> aan) en open deze pagina opnieuw.</div>';
} else {
  document.getElementById("sub").textContent += "  ·  Bijgewerkt: " + FORECAST.updated;
  app.innerHTML = `
  <div class="card">
    <h2>1. Kies de dag en de duur van je programma</h2>
    <div class="row"><span class="lbl">Dag</span><span id="days"></span></div>
    <div class="row" style="margin-top:8px"><span class="lbl">Duur van de was-/vaat-/droogbeurt</span>
      <button class="opt" data-min="45">45 min</button>
      <button class="opt active" data-min="60">1 u</button>
      <button class="opt" data-min="90">1 u 30</button>
      <button class="opt" data-min="120">2 u</button>
      <button class="opt" data-min="180">3 u</button>
      <span class="custom">of eigen duur: <input id="cust" type="number" min="15" step="15" placeholder="min"> min</span>
    </div>
    <div class="result" id="result"></div>
    <div class="chartbox"><canvas id="chart"></canvas></div>
    <div class="hint">Het oranje blok is het aaneengesloten tijdvenster met de hoogste verwachte zonne-opbrengst voor de gekozen duur. Start je toestel daar, dan draait het maximaal op eigen stroom.</div>
  </div>
  <div class="card">
    <h2>2. Beste starttijd per programmaduur (gekozen dag)</h2>
    <table><thead><tr><th>Programmaduur</th><th>Beste blok</th><th>Verwachte PV in blok</th></tr></thead><tbody id="tbl"></tbody></table>
  </div>`;

  let curDay=0, curMin=60, chart=null;

  const daysEl=document.getElementById("days");
  FORECAST.days.forEach((d,i)=>{
    const b=document.createElement("button"); b.className="day"+(i===0?" active":""); b.textContent=d.naam; b.dataset.day=i;
    b.onclick=()=>{ document.querySelectorAll("button.day").forEach(x=>x.classList.remove("active")); b.classList.add("active"); curDay=i; render(); };
    daysEl.appendChild(b);
  });

  function step(day){ return day.labels.length>1 ? toMin(day.labels[1])-toMin(day.labels[0]) : 60; }
  function bestWindow(watts, minutes, stepMin){
    const n=Math.max(1, Math.round(minutes/stepMin));
    if(n>=watts.length){ return {i:0,j:watts.length-1}; }
    let best=-1, bi=0;
    for(let i=0;i+n<=watts.length;i++){ let s=0; for(let k=i;k<i+n;k++) s+=watts[k]; if(s>best){best=s;bi=i;} }
    return {i:bi,j:bi+n-1};
  }
  function kwhOf(watts,i,j,stepMin){ let s=0; for(let k=i;k<=j;k++) s+=watts[k]; return s*(stepMin/60)/1000; }

  function render(){
    const d=FORECAST.days[curDay], w=d.watts, st=step(d);
    const bw=bestWindow(w,curMin,st);
    const colors=w.map((_,idx)=> (idx>=bw.i&&idx<=bw.j)?"#f59e0b":"rgba(42,157,143,0.45)");
    const startL=d.labels[bw.i];
    const endL=fmt(toMin(d.labels[bw.j])+st);
    const blockKwh=kwhOf(w,bw.i,bw.j,st);
    document.getElementById("result").innerHTML =
      "Beste moment om te starten: <span class='big'>"+startL+"</span> &nbsp;(blok "+startL+"–"+endL+")<br>"+
      "<b>Verwachte eigen zonne-opbrengst in dit blok: "+blockKwh.toFixed(1)+" kWh</b> &nbsp;·&nbsp; dagtotaal "+d.kwh.toFixed(1)+" kWh, piek "+d.wattpiek+" W";
    if(!chart){
      chart=new Chart(document.getElementById("chart"),{ type:"bar",
        data:{labels:d.labels, datasets:[{label:"Verwachte PV (W)", data:w, backgroundColor:colors, borderWidth:0, categoryPercentage:1.0, barPercentage:1.0}]},
        options:{responsive:true, maintainAspectRatio:false, plugins:{legend:{display:false}, tooltip:{callbacks:{label:(it)=>it.raw+" W"}}},
          scales:{x:{ticks:{maxTicksLimit:16,font:{size:9}},grid:{display:false}}, y:{beginAtZero:true, title:{display:true,text:"Verwacht vermogen (W)"}}}} });
    } else { chart.data.labels=d.labels; chart.data.datasets[0].data=w; chart.data.datasets[0].backgroundColor=colors; chart.update(); }
    const presets=[45,60,90,120,180];
    document.getElementById("tbl").innerHTML=presets.map(p=>{
      const b=bestWindow(w,p,st); const s=d.labels[b.i]; const e=fmt(toMin(d.labels[b.j])+st);
      const lbl=p<60?p+" min":(p%60?Math.floor(p/60)+" u "+(p%60):p/60+" u");
      return "<tr><td>"+lbl+"</td><td class='win'>"+s+"–"+e+"</td><td>"+kwhOf(w,b.i,b.j,st).toFixed(1)+" kWh</td></tr>";
    }).join("");
  }
  document.querySelectorAll("button.opt").forEach(b=> b.onclick=()=>{ document.querySelectorAll("button.opt").forEach(x=>x.classList.remove("active")); b.classList.add("active"); curMin=+b.dataset.min; document.getElementById("cust").value=""; render(); });
  document.getElementById("cust").oninput=(e)=>{ const v=parseInt(e.target.value); if(v>=15){ document.querySelectorAll("button.opt").forEach(x=>x.classList.remove("active")); curMin=v; render(); } };
  render();
}
</script>
</body>
</html>
